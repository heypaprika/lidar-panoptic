defaults:
  - data: semantickitti
  - model: spvcnn
  - _self_

seed: 42
task: panoptic          # semantic | panoptic
trainer:
  max_epochs: 40
  precision: 16-mixed   # fp16 for 24GB
  accumulate_grad_batches: 2
  devices: 1
loss:
  lovasz: 1.0
  ce: 1.0
  center: 1.0           # MSE
  offset: 1.0           # L1 (thing points)
cluster:
  eps: 0.6              # DBSCAN on offset-shifted coords (m)
  min_points: 20
