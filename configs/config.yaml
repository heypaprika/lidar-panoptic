defaults:
  - data: semantickitti
  - model: minkunet
  - _self_

seed: 42
task: semantic          # GATE 1: semantic | panoptic(GATE 2)
trainer:
  max_epochs: 40
  precision: 32         # spconv Native + AMP is unstable; fp32 is safe on 24GB. (bf16-mixed optional)
  accumulate_grad_batches: 2
  devices: 1
  limit_train_batches: 1.0      # <1.0 subsamples per epoch for fast reduced-setting runs
  limit_val_batches: 1.0
  check_val_every_n_epoch: 1    # raise to 2+ if panoptic val (DBSCAN) is slow
loss:
  lovasz: 1.0
  ce: 1.0
  center: 1.0           # MSE
  offset: 1.0           # L1 (thing points)
  center_sigma: 1.0     # m; center_gt = exp(-||offset||^2 / 2σ²)
cluster:
  eps: 0.6              # DBSCAN on offset-shifted coords (m)
  min_points: 20
ckpt: null             # checkpoint path for eval.py / scripts.viz
oracle: none           # panoptic debug: none | semantic (GT sem) | instance (GT inst) — PQ 오차 분해
pq_in_val: false       # 학습 중 validation에서 PQ 계산? (느림) — 기본 off, PQ는 src.eval에서
viz:
  seq: "08"
  frame: "000000"
  save: null           # dir to write offscreen PNGs; null = interactive Open3D windows
